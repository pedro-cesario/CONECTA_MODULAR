<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9f9ff;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(19, 79, 159, 0.1);
            border-radius: 28px;
        }

        .bg-blur-image {

            filter: blur(10px) brightness(0.85);
            transform: scale(1.1);
        }

        .primary-gradient {
            background: linear-gradient(180deg, #134F9F 0%, #1E5CB3 100%);

            animation: floating 3s ease-in-out infinite;

            box-shadow: 0 0 0 4px rgba(0, 56, 122, 0.1);

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;

<body class="min-h-screen flex items-center justify-center p-4">
<!-- Background Layer -->
<div class="fixed inset-0 bg-blur-image -z-10"></div>
<div class="fixed inset-0 bg-primary/20 -z-10"></div>
<!-- Login Container -->
<main class="w-full max-w-[480px] z-10">
<div class="glass-card p-10 md:p-12 flex flex-col items-center">
<!-- Floating Brand Icon -->
<div class="float-animation bg-white p-4 rounded-full shadow-lg mb-8">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">
                    monitor_heart
                </span>
</div>
<!-- Identity Header -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Conecta HEAL</h1>
<p class="font-body-lg text-body-lg text-secondary">Integrações Assistenciais</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full space-y-6" method="POST" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="username">Usuário</label>
<div class="relative flex items-center input-focus-glow transition-all duration-300 rounded-xl">
<span class="material-symbols-outlined absolute left-4 text-outline">person</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-white/50 border border-outline-variant rounded-xl focus:border-primary focus:ring-0 font-body-md transition-colors" id="username" name="username" placeholder="Seu nome de usuário" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="password">Senha</label>
<div class="relative flex items-center input-focus-glow transition-all duration-300 rounded-xl">
<span class="material-symbols-outlined absolute left-4 text-outline">lock</span>
<input class="w-full h-[48px] pl-12 pr-12 bg-white/50 border border-outline-variant rounded-xl focus:border-primary focus:ring-0 font-body-md transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password & Remember Me -->
<div class="flex items-center justify-between px-1">
<label class="flex items-center cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20" type="checkbox"/>
<span class="ml-2 font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">Lembrar-me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline font-bold" href="#">Esqueceu a senha?</a>
</div>
<!-- Login Button -->
<button class="w-full h-[52px] primary-gradient text-white font-headline-sm text-headline-sm rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-[0.98] active:opacity-90 transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Entrar
                    <span class="material-symbols-outlined">login</span>
</button>
</form>
<!-- Footer Meta -->
<div class="mt-12 text-center">
<p class="font-label-md text-label-md text-on-surface-variant/60">
                    © 2024 Hospital Espírita André Luiz
                </p>
<div class="mt-4 flex gap-4 justify-center">
<a class="text-primary/70 hover:text-primary font-label-md text-label-md transition-colors" href="#">Suporte Técnico</a>
<span class="text-outline-variant">•</span>
<a class="text-primary/70 hover:text-primary font-label-md text-label-md transition-colors" href="#">Privacidade</a>
</div>
</div>
</div>
<!-- Atmospheric Sub-text -->
<div class="mt-8 text-center text-white/80 font-body-md drop-shadow-sm">
            Acesse o ecossistema de dados clínicos com segurança e agilidade.
        </div>
</main>
<!-- Micro-interaction Script -->
<script>
        // Toggle Password Visibility
        const passwordInput = document.getElementById('password');
        const toggleBtn = passwordInput.nextElementSibling;
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.querySelector('span').innerText = isPassword ? 'visibility_off' : 'visibility';
        });

        // Simple button active state simulation
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('mousedown', () => loginBtn.classList.add('scale-95'));
        loginBtn.addEventListener('mouseup', () => loginBtn.classList.remove('scale-95'));
        loginBtn.addEventListener('mouseleave', () => loginBtn.classList.remove('scale-95'));
    </script>
</body></html>
