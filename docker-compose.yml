services:
  node:
    build: .
    ports:
      - "3020:3020"
    container_name: conecta-modular-node
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3020
      - DOCKER_CONTAINER=true
    volumes:
      - ./auth.sqlite:/home/node/app/auth.sqlite
      - ./data:/home/node/app/data
      - ./frontend:/home/node/app/frontend
      - ./backend:/home/node/app/backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3020/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: conecta-modular-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_pwd_default}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c '[ \"$$(redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null)\" = \"PONG\" ]'"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
    driver: bridge

volumes:
  redis_data:
