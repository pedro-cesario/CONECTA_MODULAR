<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#134F9F">
  <title>Conecta HEAL - Testes Automatizados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div id="screen-login" class="screen active">
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-header">
          <div class="login-icon">
            <i class="bi bi-speedometer2"></i>
          </div>
          <h1>Testes Automatizados</h1>
          <p class="subtitle">Conecta HEAL - Homologação</p>
        </div>
        <form id="form-login" autocomplete="off">
          <div class="input-group-custom">
            <i class="bi bi-person"></i>
            <input type="text" id="inp-usuario" placeholder="Nome de usuário" required>
          </div>
          <div class="input-group-custom mt-3">
            <i class="bi bi-lock"></i>
            <input type="password" id="inp-senha" placeholder="Senha do Windows" required>
          </div>
          <button type="submit" class="btn-primary mt-4" id="btn-login">
            <span class="btn-text">Entrar</span>
            <span class="btn-loader d-none"><i class="bi bi-arrow-repeat spin"></i></span>
          </button>
        </form>
        <div id="login-error" class="alert alert-danger d-none mt-3"></div>
      </div>
    </div>
  </div>

  <div id="screen-app" class="screen">
    <nav class="topbar">
      <div class="topbar-left">
        <i class="bi bi-speedometer2"></i>
        <span class="topbar-title">Testes Automatizados</span>
      </div>
      <div class="topbar-right">
        <span class="user-badge" id="user-display">
          <i class="bi bi-person-circle"></i>
          <span id="user-name"></span>
        </span>
        <button class="btn-logout" id="btn-logout" title="Sair">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </nav>

    <div class="test-container">
      <div class="test-header">
        <div class="test-status" id="test-status">
          <i class="bi bi-check-circle-fill"></i>
          <span>Pronto para testar</span>
        </div>
        <button class="btn-run-tests" id="btn-run-tests" disabled>
          <i class="bi bi-play-fill"></i>
          Executar Testes
        </button>
      </div>

      <div class="test-progress d-none" id="test-progress">
        <div class="progress-bar-wrapper">
          <div class="progress-bar"></div>
        </div>
        <span class="progress-text" id="progress-text">Executando...</span>
      </div>

      <div class="test-results" id="test-results">
        <div class="results-empty">
          <i class="bi bi-play-circle"></i>
          <p>Clique em "Executar Testes" para iniciar</p>
        </div>
      </div>

      <div class="test-history" id="test-history">
        <h3><i class="bi bi-clock-history"></i> Histórico</h3>
        <div class="history-list" id="history-list">
          <div class="history-empty">Nenhuma execução anterior</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
</body>
</html>
